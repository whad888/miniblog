{{ define "main" }}
<h1>Welcome</h1>
<p>Posts below are published automatically by CONTENT_STUDIO.</p>
<ul>
{{ range (where .Site.RegularPages "Section" "posts") }}
  <li><a href="{{ .RelPermalink }}">{{ .Title }}</a>{{ with .Date }} — {{ .Format "2006-01-02" }}{{ end }}</li>
{{ end }}
</ul>
{{ end }}
