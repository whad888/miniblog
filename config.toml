# Minimal Hugo blog — deployment target for CONTENT_STUDIO's heartbeat.
#
# Base URL: set this to your Cloudflare Pages URL once it is assigned, e.g.
#   baseURL = "https://my-blog.pages.dev/"
# (CONTENT_STUDIO fills in post URLs from this when it publishes, so they show
#  up correctly in the heartbeat report.)
baseURL = "https://my-blog.pages.dev/"
languageCode = "en-us"
title = "My CONTENT_STUDIO Blog"

# Posts are dropped into content/posts by the heartbeat (tools/distribute.py
# StaticPublisher). No theme is required — minimal layouts ship in layouts/.
enableGitInfo = false
